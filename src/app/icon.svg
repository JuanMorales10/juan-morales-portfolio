<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="jm-icono">
  <title id="jm-icono">Juan Morales</title>
  <!--
    Monograma JM: jade sólido, letra en hueso, sin degradados. Las letras están
    dibujadas como trazo y no como texto para que se vean iguales en cualquier
    navegador. El aire entre la J y la M es igual al grosor del trazo: con menos
    los dos astiles se funden en una sola mancha cuando el favicon baja a 16 px.
  -->
  <rect width="64" height="64" rx="14" fill="#0d5346" />
  <g fill="none" stroke="#f3f0e9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23 22 V35.5 A7 7 0 0 1 11 39.5" />
    <path d="M35 42 V22 L44 38 L53 22 V42" />
  </g>
</svg>
